<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>LoClip</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><span class="logo">Lo</span>Clip</div>
    <form id="searchForm" class="search">
      <input id="q" type="search" autocomplete="off" placeholder="" />
      <button type="submit" class="primary" data-i18n="search">Buscar</button>
    </form>
    <div class="modes" id="modes">
      <button data-mode="all" class="chip active" data-i18n="mode_all">Todo</button>
      <button data-mode="visual" class="chip" data-i18n="mode_visual">Visual</button>
      <button data-mode="speech" class="chip" data-i18n="mode_speech">Voz</button>
      <button data-mode="name" class="chip" data-i18n="mode_name">Nombre</button>
    </div>
    <div class="tools">
      <label class="iconbtn" title="" data-i18n-title="search_image"><input type="file" id="imgFile" accept="image/*" hidden>🖼</label>
      <button class="iconbtn ppro-only" id="btnMatchMonitor" data-i18n-title="match_monitor" title="">🎯</button>
      <button class="iconbtn" id="btnLang" title="ES / EN">🌐</button>
      <button class="iconbtn" id="btnSettings" data-i18n-title="settings" title="">⚙</button>
    </div>
  </header>

  <div id="main">
    <aside id="side">
      <section>
        <h3><span data-i18n="sources">Fuentes</span> <button class="mini" id="btnAddSource">+</button></h3>
        <ul id="sourceList" class="list"></ul>
        <label class="row small"><input type="checkbox" id="availableOnly"> <span data-i18n="available_only">Solo disponibles ahora</span></label>
      </section>
      <section>
        <h3><span data-i18n="collections">Colecciones</span> <button class="mini" id="btnAddCollection">+</button></h3>
        <ul id="collectionList" class="list"></ul>
      </section>
      <section>
        <h3><span data-i18n="concepts">Conceptos</span> <button class="mini" id="btnAddConcept" data-i18n-title="concept_help" title="">+</button></h3>
        <ul id="conceptList" class="list"></ul>
      </section>
    </aside>

    <main id="content">
      <div id="resultsHeader" class="row between">
        <div id="resultsTitle" class="muted"></div>
        <div class="row">
          <label class="small muted"><span data-i18n="per_file">Por archivo</span>
            <select id="perFile"><option value="1">1</option><option value="3" selected>3</option><option value="10">10</option><option value="0" data-i18n="all_moments">todos</option></select>
          </label>
          <label class="small muted"><span data-i18n="size">Tamaño</span> <input type="range" id="zoom" min="120" max="360" value="200"></label>
        </div>
      </div>
      <div id="selectionBar" class="hidden">
        <span id="selCount"></span>
        <button id="selToCollection" data-i18n="add_to_collection">Agregar a colección</button>
        <button id="selToConcept" data-i18n="teach_concept">Enseñar concepto</button>
        <button id="selInsertAll" class="ppro-only" data-i18n="insert_all">Insertar todos</button>
        <button id="selClear" data-i18n="clear">Limpiar</button>
      </div>
      <div id="results" class="grid"></div>
      <div id="empty" class="empty"></div>
    </main>

    <aside id="detail" class="hidden">
      <div class="row between">
        <h3 id="detailName"></h3>
        <button class="mini" id="detailClose">✕</button>
      </div>
      <div id="detailMeta" class="small muted"></div>
      <div id="detailPreview"></div>
      <div id="detailActions" class="row wrap"></div>
      <h4 data-i18n="keywords">Palabras clave</h4>
      <div class="row"><input id="detailKeywords" type="text"><button id="detailSaveKw" class="mini" data-i18n="save">Guardar</button></div>
      <h4 data-i18n="moments">Momentos</h4>
      <div id="detailMoments" class="strip"></div>
      <h4><span data-i18n="transcript">Transcripción</span> <a id="detailTxt" class="small" target="_blank" data-i18n="export_txt">exportar .txt</a></h4>
      <div id="detailTranscript" class="transcript"></div>
    </aside>
  </div>

  <footer id="statusbar">
    <span id="statusText"></span>
    <div id="statusProgress"><div id="statusFill"></div></div>
    <button class="mini" id="btnPause"></button>
  </footer>

  <!-- Modales -->
  <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
  <div id="toast" class="toast hidden"></div>
</div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
